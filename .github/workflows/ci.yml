name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.96.0"

jobs:
  verify:
    name: Build, package, and database fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libsqlite3-dev sqlite3 postgresql-16 maven
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"

      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache Rust dependencies and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            engine/target/debug
          key: ${{ runner.os }}-rust-workspace-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('engine/Cargo.lock', 'engine/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-workspace-${{ env.RUST_TOOLCHAIN }}-

      - name: Check Rust formatting
        run: cargo fmt --manifest-path engine/Cargo.toml --all -- --check

      - name: Verify database startup failure paths
        run: python3 Scripts/test-mysql-ready.py

      - name: Verify accuracy and scale measurement invariants
        run: |
          python3 Scripts/test-sqlserver-oracle-accuracy.py
          python3 Scripts/test-benchmark-scale.py
          python3 Scripts/test-probe-sqlite-benchmark.py
          python3 Scripts/test-review-action.py
          python3 Scripts/test-dml-accuracy.py

      - name: Build and test the Rust workspace
        run: |
          cargo build --manifest-path engine/Cargo.toml --workspace --locked
          cargo test --manifest-path engine/Cargo.toml --workspace --locked

      - name: Verify JSON contracts and competitive CLI behavior
        run: |
          for dialect in postgres sqlserver oracle; do
            cmp "engine/source/src/sql/catalog-$dialect.sql" "probe-go/sql/catalog-$dialect.sql"
          done
          cmp engine/source/src/sql/visibility-postgres.sql probe-go/sql/visibility-postgres.sql
          cmp engine/source/src/sql/columns-postgres.sql probe-go/sql/columns-postgres.sql
          python3 -m venv "$RUNNER_TEMP/jsonschema-venv"
          "$RUNNER_TEMP/jsonschema-venv/bin/pip" install --disable-pip-version-check --no-input 'jsonschema==4.23.0' 'sqlglot==30.18.0'
          "$RUNNER_TEMP/jsonschema-venv/bin/python" Scripts/verify-contracts.py \
            --engine engine/target/debug/schemagraph
          python3 Scripts/verify-competitive.py --engine engine/target/debug/schemagraph
          python3 Scripts/verify-cancellation.py --engine engine/target/debug/schemagraph
          python3 Scripts/verify-html.py --engine engine/target/debug/schemagraph \
            --screenshot "$RUNNER_TEMP/html-smoke.png"
          curl --fail --location --retry 3 \
            https://docs.oasis-open.org/sarif/sarif/v2.1.0/errata01/os/schemas/sarif-schema-2.1.0.json \
            --output "$RUNNER_TEMP/sarif-schema.json"
          echo "c3b4bb2d6093897483348925aaa73af03b3e3f4bd4ca38cef26dcb4212a2682e  $RUNNER_TEMP/sarif-schema.json" | sha256sum --check
          "$RUNNER_TEMP/jsonschema-venv/bin/python" Scripts/verify-review-action.py \
            --engine engine/target/debug/schemagraph --schema "$RUNNER_TEMP/sarif-schema.json"

      - name: Prepare consumer Action snapshots
        run: python3 Scripts/verify-review-action.py --prepare .review-action-smoke

      - name: Invoke the consumer Action
        id: review_action
        uses: ./
        continue-on-error: true
        with:
          before: .review-action-smoke/before.json
          after: .review-action-smoke/after.json
          policy: .review-action-smoke/policy.toml
          engine-path: engine/target/debug/schemagraph

      - name: Verify the Action exposes findings and artifacts
        env:
          REVIEW_CODE: ${{ steps.review_action.outputs.exit-code }}
          REVIEW_OUTCOME: ${{ steps.review_action.outcome }}
          REVIEW_JSON: ${{ steps.review_action.outputs.json }}
          REVIEW_SARIF: ${{ steps.review_action.outputs.sarif }}
          REVIEW_MARKDOWN: ${{ steps.review_action.outputs.markdown }}
        run: |
          test "$REVIEW_CODE" = 1
          test "$REVIEW_OUTCOME" = failure
          test -s "$REVIEW_JSON"
          test -s "$REVIEW_SARIF"
          test -s "$REVIEW_MARKDOWN"

      - name: Measure public schema accuracy against independent references
        env:
          PGBIN: /usr/lib/postgresql/16/bin
        run: |
          "$RUNNER_TEMP/jsonschema-venv/bin/python" Scripts/verify-accuracy.py \
            --engine engine/target/debug/schemagraph --sqlglot --suite all --strict \
            --output "$RUNNER_TEMP/accuracy.json"

      - name: Verify real dbt compilation and query-log import
        env:
          PGBIN: /usr/lib/postgresql/16/bin
          DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
        run: |
          python3 -m venv "$RUNNER_TEMP/dbt-venv"
          "$RUNNER_TEMP/dbt-venv/bin/pip" install --disable-pip-version-check --no-input \
            'dbt-core==1.12.5' 'dbt-postgres==1.11.0'
          python3 Scripts/verify-external-imports.py --engine engine/target/debug/schemagraph \
            --dbt "$RUNNER_TEMP/dbt-venv/bin/dbt" --output "$RUNNER_TEMP/imports-check.json"

      - name: Measure MySQL and MariaDB public schema accuracy
        run: |
          "$RUNNER_TEMP/jsonschema-venv/bin/python" Scripts/verify-mysql-accuracy.py \
            --engine engine/target/debug/schemagraph --sqlglot --strict \
            --output "$RUNNER_TEMP/mysql-accuracy.json"

      - name: Check bundled documents and licenses
        run: |
          cmp skills/schemagraph/SKILL.md engine/cli/SKILL.md
          engine/target/debug/schemagraph skill > "$RUNNER_TEMP/skill.md"
          cmp skills/schemagraph/SKILL.md "$RUNNER_TEMP/skill.md"
          for crate in core source parser analysis export cli; do
            cmp LICENSE-MIT "engine/$crate/LICENSE-MIT"
            cmp LICENSE-APACHE "engine/$crate/LICENSE-APACHE"
          done

      - name: Build all distributable crates
        run: |
          # 패키지 검증이 레지스트리 의존성으로 만든 CLI와 작업용 바이너리를 분리한다.
          sha256sum engine/target/debug/schemagraph > "$RUNNER_TEMP/workspace-cli.sha256"
          cargo package --manifest-path engine/Cargo.toml --workspace --locked \
            --target-dir "$RUNNER_TEMP/package-target"
          sha256sum --check "$RUNNER_TEMP/workspace-cli.sha256"

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.6.1"
          cache-provider: basic

      - name: Build and test the JDBC probe
        run: gradle -p probe check shadowJar --no-daemon --console=plain

      - name: Verify the JDBC accuracy SQL utility
        run: python3 Scripts/test-accuracy-sql.py --jdbc-jar probe/build/libs/schemagraph-probe-all.jar

      - name: Verify local Maven publication and consumers
        run: Scripts/verify-probe-maven.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: probe-go/go.mod
          cache-dependency-path: probe-go/go.sum

      - name: Check and build the Go probe
        working-directory: probe-go
        run: |
          gofmt -l . | tee "$RUNNER_TEMP/gofmt-files.txt"
          test ! -s "$RUNNER_TEMP/gofmt-files.txt"
          go vet ./...
          go test ./...
          CGO_ENABLED=0 go build ./...

      - name: Download external JDBC fixture drivers
        run: |
          curl --fail --location --retry 3 \
            https://repo.maven.apache.org/maven2/com/mysql/mysql-connector-j/26.7.0/mysql-connector-j-26.7.0.jar \
            --output "$RUNNER_TEMP/mysql-connector-j.jar"
          curl --fail --location --retry 3 \
            https://repo.maven.apache.org/maven2/com/oracle/ojdbc/ojdbc8/19.3.0.0/ojdbc8-19.3.0.0.jar \
            --output "$RUNNER_TEMP/ojdbc8.jar"
          echo "69084713593a4aa8d07c383619b9639276f08bccf8faf1c562178147d389b1e1  $RUNNER_TEMP/mysql-connector-j.jar" | sha256sum --check
          echo "a66d27a14f3adee484427cc4de008af85a5c3e78e2e3285a4dba1277332978a5  $RUNNER_TEMP/ojdbc8.jar" | sha256sum --check

      - name: Verify dependency catalogs and index metadata in SQLite and PostgreSQL
        env:
          PGBIN: /usr/lib/postgresql/16/bin
        run: |
          python3 Scripts/verify-catalog-dependencies.py \
            --engine engine/target/debug/schemagraph \
            --go-probe probe-go/schemagraph-probe-go \
            --jdbc-jar probe/build/libs/schemagraph-probe-all.jar

      - name: Verify restricted PostgreSQL collection and comparison scope
        env:
          PGBIN: /usr/lib/postgresql/16/bin
        run: |
          python3 Scripts/verify-collection-scope.py --engine engine/target/debug/schemagraph \
            --output "$RUNNER_TEMP/scope-native.json"
          python3 Scripts/verify-collection-scope.py --engine engine/target/debug/schemagraph \
            --go-probe probe-go/schemagraph-probe-go --output "$RUNNER_TEMP/scope-go.json"
          python3 Scripts/verify-collection-scope.py --engine engine/target/debug/schemagraph \
            --jdbc-jar probe/build/libs/schemagraph-probe-all.jar --java "$JAVA_HOME/bin/java" \
            --output "$RUNNER_TEMP/scope-jdbc.json"

      - name: Verify schema lint rules against real catalogs and producers
        env:
          PGBIN: /usr/lib/postgresql/16/bin
        run: |
          python3 Scripts/verify-schema-lint.py --engine engine/target/debug/schemagraph \
            --go-probe probe-go/schemagraph-probe-go \
            --jdbc-jar probe/build/libs/schemagraph-probe-all.jar --java "$JAVA_HOME/bin/java" \
            --output "$RUNNER_TEMP/schema-lint.json"

      - name: Verify isthmus bridge-facts export against real catalogs
        env:
          PGBIN: /usr/lib/postgresql/16/bin
        run: |
          python3 Scripts/verify-bridge-facts.py --engine engine/target/debug/schemagraph \
            --output "$RUNNER_TEMP/bridge-facts.json"

      - name: Verify every database fixture
        env:
          SG_MYSQL_JAR: ${{ runner.temp }}/mysql-connector-j.jar
          SG_ORACLE_JAR: ${{ runner.temp }}/ojdbc8.jar
          SG_FIXTURE_ARTIFACTS: ${{ runner.temp }}/fixture-artifacts
        run: |
          # 선택 검증을 건너뛰어도 로컬 스크립트는 성공하므로 CI에서는 경고를 실패로 바꾼다.
          Scripts/verify-fixtures.sh 2>&1 | tee "$RUNNER_TEMP/fixtures.log"
          if grep -q '^주의:' "$RUNNER_TEMP/fixtures.log"; then
            echo '::error::Fixture coverage is incomplete; resolve the warnings above.'
            exit 1
          fi

      - name: Preserve fixture graphs for review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixture-graphs
          path: |
            ${{ runner.temp }}/fixture-artifacts/*.graph.json
            ${{ runner.temp }}/html-smoke.png
            ${{ runner.temp }}/accuracy.json
            ${{ runner.temp }}/mysql-accuracy.json
            ${{ runner.temp }}/scope-*.json
            ${{ runner.temp }}/imports-check.json
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Container build and consumer smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: docker build --tag schemagraph:ci .
      - run: python3 Scripts/verify-container.py --image schemagraph:ci --output "$RUNNER_TEMP/container.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: container-smoke
          path: ${{ runner.temp }}/container.json
          if-no-files-found: error
