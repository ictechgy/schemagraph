name: Release binaries

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "engine/**"
      - "probe/**"
      - "probe-go/**"
      - "INSTALLATION.md"
      - ".github/workflows/release-binaries.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.96.0"

jobs:
  prepare:
    name: Check release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      publish: ${{ steps.metadata.outputs.publish }}
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag and package versions
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          cargo_text = Path("engine/Cargo.toml").read_text()
          gradle_text = Path("probe/build.gradle.kts").read_text()
          cargo_match = re.search(r'(?m)^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"', cargo_text)
          gradle_match = re.search(
              r'(?m)^version\s*=\s*providers\.gradleProperty\("probeVersion"\)'
              r'\.orElse\("([0-9]+\.[0-9]+\.[0-9]+)"\)',
              gradle_text,
          )
          if not cargo_match or not gradle_match:
              raise SystemExit("could not read the Cargo or Gradle release version")
          cargo_version = cargo_match.group(1)
          gradle_version = gradle_match.group(1)
          if cargo_version != gradle_version:
              raise SystemExit(
                  f"Cargo ({cargo_version}) and Gradle ({gradle_version}) versions differ"
              )

          is_tag = os.environ["EVENT_NAME"] == "push" and os.environ["REF_TYPE"] == "tag"
          if is_tag:
              tag = os.environ["REF_NAME"]
              if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
                  raise SystemExit("release tags must be vMAJOR.MINOR.PATCH")
              tag_version = tag[1:]
              if cargo_version != tag_version or gradle_version != tag_version:
                  raise SystemExit(
                      f"tag {tag} does not match Cargo/Gradle version {cargo_version}"
                  )
              resolved = subprocess.check_output(
                  ["git", "rev-parse", f"refs/tags/{tag}^{{}}"], text=True
              ).strip()
              if resolved != os.environ["EVENT_SHA"]:
                  raise SystemExit(
                      f"tag {tag} does not resolve to the event commit {os.environ['EVENT_SHA']}"
                  )
          else:
              tag = ""

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a") as handle:
              handle.write(f"version={cargo_version}\n")
              handle.write(f"publish={'true' if is_tag else 'false'}\n")
          print(f"validated version {cargo_version}; publish={is_tag}; tag={tag or '(manual)'}")
          PY

  build-native:
    name: Build ${{ matrix.target }} binaries
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check runner architecture
        run: |
          case "$TARGET" in
            x86_64-unknown-linux-gnu) test "$(uname -s)" = Linux && test "$(uname -m)" = x86_64 ;;
            aarch64-apple-darwin) test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64 ;;
            *) echo "unsupported target: $TARGET" >&2; exit 2 ;;
          esac

      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add "$TARGET" --toolchain "$RUST_TOOLCHAIN"
          rustup default "$RUST_TOOLCHAIN"

      - name: Build the CLI
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: cargo build --manifest-path engine/Cargo.toml --locked --release --target "$TARGET" -p schemagraph-cli

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: probe-go/go.mod
          cache-dependency-path: probe-go/go.sum

      - name: Build the Go probe
        working-directory: probe-go
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/schemagraph-probe-go" .

      - name: Validate extracted binaries with a SQLite fixture
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: |
          set -euo pipefail
          cli="$RUNNER_TEMP/cargo-target/$TARGET/release/schemagraph"
          go_probe="$RUNNER_TEMP/schemagraph-probe-go"
          "$cli" --version
          "$cli" --help >/dev/null
          "$go_probe" --help >/dev/null

          fixture="$RUNNER_TEMP/release-smoke.db"
          python3 - "$fixture" <<'PY'
          import sqlite3
          import sys

          connection = sqlite3.connect(sys.argv[1])
          connection.executescript("""
          PRAGMA foreign_keys = ON;
          CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT NOT NULL);
          CREATE TABLE orders (
              id INTEGER PRIMARY KEY,
              customer_id INTEGER NOT NULL REFERENCES customers(id)
          );
          CREATE VIEW customer_orders AS
              SELECT customers.name, orders.id
              FROM customers JOIN orders ON orders.customer_id = customers.id;
          INSERT INTO customers VALUES (1, 'Ada');
          INSERT INTO orders VALUES (10, 1);
          """)
          connection.commit()
          connection.close()
          PY

          mkdir -p "$RUNNER_TEMP/smoke"
          "$cli" scan "sqlite:$fixture" --source-id release-smoke \
            --emit-document "$RUNNER_TEMP/smoke/catalog.json" \
            -o "$RUNNER_TEMP/smoke/graph.json"
          "$go_probe" --url "sqlite:$fixture" -o "$RUNNER_TEMP/smoke/go-catalog.json"
          "$cli" scan --document "$RUNNER_TEMP/smoke/go-catalog.json" \
            -o "$RUNNER_TEMP/smoke/go-graph.json"
          "$cli" query main.orders --graph "$RUNNER_TEMP/smoke/graph.json" \
            > "$RUNNER_TEMP/smoke/query.json"
          python3 - "$RUNNER_TEMP/smoke/graph.json" "$RUNNER_TEMP/smoke/go-graph.json" "$RUNNER_TEMP/smoke/query.json" <<'PY'
          import json
          import sys

          for path in sys.argv[1:3]:
              graph = json.load(open(path))
              names = {vertex["name"] for vertex in graph["vertices"]}
              assert {"customers", "orders", "customer_orders"} <= names, (path, names)
          query = json.load(open(sys.argv[3]))
          assert query["subject"]["id"] == "main.orders"
          assert any(item["id"] == "main.customers" for item in query["dependencies"])
          PY

      - name: Package the target archive
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/package/schemagraph-$VERSION"
          mkdir -p "$package"
          cp "$CARGO_TARGET_DIR/$TARGET/release/schemagraph" "$package/"
          cp "$RUNNER_TEMP/schemagraph-probe-go" "$package/"
          cp LICENSE-MIT LICENSE-APACHE INSTALLATION.md "$package/"
          chmod 755 "$package/schemagraph" "$package/schemagraph-probe-go"
          archive="$RUNNER_TEMP/schemagraph-$VERSION-$TARGET.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$archive" -C "$RUNNER_TEMP/package" "schemagraph-$VERSION"
          mkdir -p "$RUNNER_TEMP/release-artifact"
          cp "$archive" "$RUNNER_TEMP/release-artifact/"

      - name: Upload target archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schemagraph-${{ needs.prepare.outputs.version }}-${{ matrix.target }}
          path: ${{ runner.temp }}/release-artifact/schemagraph-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-jdbc:
    name: Build standalone JDBC probe
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.6.1"
          cache-provider: basic

      - name: Build and validate the standalone JAR
        run: |
          set -euo pipefail
          gradle -p probe shadowJar --no-daemon --console=plain
          jar="probe/build/libs/schemagraph-probe-all.jar"
          test -s "$jar"
          java -jar "$jar" --help >/dev/null
          fixture="$RUNNER_TEMP/jdbc-smoke.db"
          python3 - "$fixture" <<'PY'
          import sqlite3
          import sys

          connection = sqlite3.connect(sys.argv[1])
          connection.executescript("CREATE TABLE smoke (id INTEGER PRIMARY KEY); INSERT INTO smoke VALUES (1);")
          connection.commit()
          connection.close()
          PY
          java -jar "$jar" --url "jdbc:sqlite:$fixture" -o "$RUNNER_TEMP/jdbc-catalog.json"
          python3 - "$RUNNER_TEMP/jdbc-catalog.json" <<'PY'
          import json
          import sys

          document = json.load(open(sys.argv[1]))
          assert document["dialect"] == "sqlite"
          assert any(obj["name"] == "smoke" for schema in document["schemas"] for obj in schema["objects"])
          PY
          mkdir -p "$RUNNER_TEMP/jdbc-artifact"
          cp "$jar" "$RUNNER_TEMP/jdbc-artifact/schemagraph-probe-$VERSION-all.jar"

      - name: Upload standalone JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schemagraph-${{ needs.prepare.outputs.version }}-jdbc
          path: ${{ runner.temp }}/jdbc-artifact/schemagraph-probe-${{ needs.prepare.outputs.version }}-all.jar
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble checksummed release bundle
    needs: [prepare, build-native, build-jdbc]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download immutable build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "schemagraph-$VERSION-x86_64-unknown-linux-gnu" \
            --dir "$RUNNER_TEMP/release"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "schemagraph-$VERSION-aarch64-apple-darwin" \
            --dir "$RUNNER_TEMP/release"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "schemagraph-$VERSION-jdbc" \
            --dir "$RUNNER_TEMP/release"

      - name: Create and verify release checksums
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          test -f "schemagraph-$VERSION-x86_64-unknown-linux-gnu.tar.gz"
          test -f "schemagraph-$VERSION-aarch64-apple-darwin.tar.gz"
          test -f "schemagraph-probe-$VERSION-all.jar"
          shasum -a 256 \
            "schemagraph-$VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            "schemagraph-$VERSION-aarch64-apple-darwin.tar.gz" \
            "schemagraph-probe-$VERSION-all.jar" > SHA256SUMS
          shasum -a 256 --check SHA256SUMS
          printf 'version=%s\ncommit=%s\n' "$VERSION" "$GITHUB_SHA" > RELEASE-METADATA.txt

      - name: Upload validation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schemagraph-release-${{ needs.prepare.outputs.version }}
          path: |
            ${{ runner.temp }}/release/*.tar.gz
            ${{ runner.temp }}/release/*.jar
            ${{ runner.temp }}/release/SHA256SUMS
            ${{ runner.temp }}/release/RELEASE-METADATA.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release assets
    needs: [prepare, assemble]
    if: needs.prepare.outputs.publish == 'true' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the validated bundle
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "schemagraph-release-$VERSION" \
            --dir "$RUNNER_TEMP/release"

      - name: Recheck checksums before publishing
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          shasum -a 256 --check SHA256SUMS
          test "$(sed -n 's/^version=//p' RELEASE-METADATA.txt)" = "$VERSION"
          test "$(sed -n 's/^commit=//p' RELEASE-METADATA.txt)" = "$GITHUB_SHA"

      - name: Create the release and upload assets
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "schemagraph $VERSION" \
            --generate-notes \
            "$RUNNER_TEMP/release/schemagraph-$VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            "$RUNNER_TEMP/release/schemagraph-$VERSION-aarch64-apple-darwin.tar.gz" \
            "$RUNNER_TEMP/release/schemagraph-probe-$VERSION-all.jar" \
            "$RUNNER_TEMP/release/SHA256SUMS"
