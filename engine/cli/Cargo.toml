[package]
name = "schemagraph-cli"
description = "schemagraph command line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "schemagraph"
path = "src/main.rs"

[dependencies]
schemagraph-core = { path = "../core", version = "0.2.0" }
schemagraph-source = { path = "../source", version = "0.2.0" }
schemagraph-parser = { path = "../parser", version = "0.2.0" }
schemagraph-analysis = { path = "../analysis", version = "0.2.0" }
schemagraph-export = { path = "../export", version = "0.2.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
toml = "1.1.6"
serde = { version = "1.0.229", features = ["derive"] }
