[package]
name = "schemagraph-cli"
description = "schemagraph command line interface"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "schemagraph"
path = "src/main.rs"

[dependencies]
schemagraph-core = { path = "../core" }
schemagraph-source = { path = "../source" }
schemagraph-parser = { path = "../parser" }
schemagraph-analysis = { path = "../analysis" }
schemagraph-export = { path = "../export" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
toml = "1.1.6"
serde = { version = "1.0.229", features = ["derive"] }
