[package]
name = "schemagraph-source"
description = "Catalog document types and database readers for schemagraph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
schemagraph-core = { path = "../core", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "mysql"] }
thiserror = "2"
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
